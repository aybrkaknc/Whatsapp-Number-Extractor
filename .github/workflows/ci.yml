name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # Needed only to create a release for v* tags
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - name: Check that the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"

      - name: Create a release with the extension package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --title "$GITHUB_REF_NAME" --generate-notes
